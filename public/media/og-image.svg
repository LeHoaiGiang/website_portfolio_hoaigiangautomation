<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#090d16"/>
  <!-- Circuit Grid -->
  <g opacity="0.12">
    <path d="M0 60h1200M0 120h1200M0 180h1200M0 240h1200M0 300h1200M0 360h1200M0 420h1200M0 480h1200M0 540h1200" stroke="#0ea5e9" stroke-width="1"/>
    <path d="M60 0v630M120 0v630M180 0v630M240 0v630M300 0v630M360 0v630M420 0v630M480 0v630M540 0v630M600 0v630M660 0v630M720 0v630M780 0v630M840 0v630M900 0v630M960 0v630M1020 0v630M1080 0v630M1140 0v630" stroke="#0ea5e9" stroke-width="1"/>
  </g>
  <!-- Main Brand Box -->
  <rect x="120" y="100" width="960" height="430" rx="20" fill="#0f172a" stroke="#0284c7" stroke-width="3"/>
  <!-- Chip Icon -->
  <rect x="180" y="160" width="80" height="80" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <rect x="205" y="185" width="30" height="30" rx="6" fill="#0284c7"/>
  <circle cx="220" cy="200" r="6" fill="#38bdf8"/>
  <!-- Brand Text -->
  <text x="280" y="200" fill="#ffffff" font-family="sans-serif" font-size="44" font-weight="800">Hoài Giang Automation</text>
  <text x="280" y="235" fill="#38bdf8" font-family="monospace" font-size="20">Thầy Giang Tự Động Hóa</text>
  <!-- Tagline -->
  <text x="180" y="320" fill="#e2e8f0" font-family="sans-serif" font-size="28" font-weight="600">
    Thiết kế và hiện thực các hệ thống tự động hóa
  </text>
  <text x="180" y="365" fill="#94a3b8" font-family="monospace" font-size="18">
    Embedded Systems · IoT Solutions · FPGA · PCB Design · PLC &amp; SCADA
  </text>
  <!-- Badges -->
  <g transform="translate(180, 420)">
    <rect x="0" y="0" width="160" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="80" y="26" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="14">STM32 / ESP32</text>
    <rect x="180" y="0" width="160" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="260" y="26" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="14">FPGA Verilog</text>
    <rect x="360" y="0" width="160" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="440" y="26" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="14">KiCad Hardware</text>
    <rect x="540" y="0" width="160" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="620" y="26" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="14">PLC &amp; Modbus</text>
  </g>
</svg>
