<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#090d16"/>
  <!-- Circuit Grid -->
  <g opacity="0.18">
    <path d="M0 45h800M0 90h800M0 135h800M0 180h800M0 225h800M0 270h800M0 315h800M0 360h800M0 405h800" stroke="#0ea5e9" stroke-width="0.8"/>
    <path d="M45 0v450M90 0v450M135 0v450M180 0v450M225 0v450M270 0v450M315 0v450M360 0v450M405 0v450M450 0v450M495 0v450M540 0v450M585 0v450M630 0v450M675 0v450M720 0v450M765 0v450" stroke="#0ea5e9" stroke-width="0.8"/>
  </g>
  <!-- Board Outline -->
  <rect x="180" y="80" width="440" height="290" rx="16" fill="#13233b" stroke="#0284c7" stroke-width="2.5"/>
  <!-- STM32 Chip -->
  <rect x="320" y="145" width="160" height="160" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="350" y="175" width="100" height="100" rx="6" fill="#0284c7"/>
  <!-- Chip Text -->
  <text x="400" y="215" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="700">STM32F407</text>
  <text x="400" y="235" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="11">ARM Cortex-M4</text>
  <text x="400" y="252" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="10">168MHz · FreeRTOS</text>
  <!-- Connectors -->
  <!-- RS485 Terminal -->
  <rect x="195" y="110" width="40" height="70" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="215" y="148" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="9" transform="rotate(-90 215 148)">RS-485</text>
  <!-- Ethernet RJ45 -->
  <rect x="195" y="210" width="45" height="90" rx="6" fill="#334155" stroke="#94a3b8"/>
  <text x="217" y="255" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="10" transform="rotate(-90 217 255)">ETHERNET</text>
  <!-- CAN Bus Port -->
  <rect x="560" y="110" width="45" height="70" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="582" y="145" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="9" transform="rotate(90 582 145)">CAN-BUS</text>
  <!-- Status LEDs -->
  <circle cx="580" cy="220" r="5" fill="#10b981"/>
  <circle cx="580" cy="240" r="5" fill="#38bdf8"/>
  <circle cx="580" cy="260" r="5" fill="#f59e0b"/>
  <!-- Banner Label -->
  <rect x="180" y="385" width="440" height="36" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.3)"/>
  <text x="400" y="408" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">
    STM32 Industrial Modbus Gateway · FreeRTOS / LwIP / RS485
  </text>
</svg>
