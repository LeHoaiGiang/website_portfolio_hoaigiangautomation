<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#090d16"/>
  <!-- Decorative Grid -->
  <g opacity="0.15">
    <path d="M0 45h800M0 90h800M0 135h800M0 180h800M0 225h800M0 270h800M0 315h800M0 360h800M0 405h800" stroke="#38bdf8" stroke-width="0.8"/>
    <path d="M45 0v450M90 0v450M135 0v450M180 0v450M225 0v450M270 0v450M315 0v450M360 0v450M405 0v450M450 0v450M495 0v450M540 0v450M585 0v450M630 0v450M675 0v450M720 0v450M765 0v450" stroke="#38bdf8" stroke-width="0.8"/>
  </g>
  <!-- Card Backdrop -->
  <rect x="180" y="80" width="440" height="280" rx="16" fill="#13233b" stroke="#0284c7" stroke-width="2.5"/>
  <rect x="210" y="110" width="380" height="220" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Badge -->
  <rect x="240" y="135" width="130" height="26" rx="13" fill="#0369a1"/>
  <text x="305" y="152" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">CHUYÊN ĐỀ NHÚNG</text>
  <!-- Headline -->
  <text x="240" y="195" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">Lập Trình STM32 Thực Chiến</text>
  <text x="240" y="222" fill="#38bdf8" font-family="monospace" font-size="13">Từ Bare-metal đến FreeRTOS & Bus Công Nghiệp</text>
  <!-- Module tags -->
  <g transform="translate(240, 245)">
    <rect x="0" y="0" width="85" height="24" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="42" y="16" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="10">Bare-metal</text>
    <rect x="95" y="0" width="75" height="24" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="132" y="16" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="10">FreeRTOS</text>
    <rect x="180" y="0" width="65" height="24" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="212" y="16" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="10">CAN-Bus</text>
    <rect x="255" y="0" width="65" height="24" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="287" y="16" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="10">Modbus</text>
  </g>
  <!-- Banner -->
  <rect x="180" y="380" width="440" height="36" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.3)"/>
  <text x="400" y="403" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">
    Khóa học: Lập trình STM32 thực chiến từ cơ bản đến nâng cao
  </text>
</svg>
