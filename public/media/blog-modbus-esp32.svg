<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0b172a"/>
  <!-- Technical Grid Background -->
  <g opacity="0.12">
    <path d="M0 50h800M0 100h800M0 150h800M0 200h800M0 250h800M0 300h800M0 350h800M0 400h800" stroke="#f59e0b" stroke-width="1"/>
    <path d="M50 0v450M100 0v450M150 0v450M200 0v450M250 0v450M300 0v450M350 0v450M400 0v450M450 0v450M500 0v450M550 0v450M600 0v450M650 0v450M700 0v450M750 0v450" stroke="#f59e0b" stroke-width="1"/>
  </g>
  <!-- Gateway Flow Diagram -->
  <g transform="translate(110, 85)">
    <!-- Sensor / Inverter RS485 Field -->
    <rect x="0" y="40" width="130" height="120" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="65" y="70" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="bold">FIELD DEVICES</text>
    <text x="65" y="95" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Biến tần Inverter</text>
    <text x="65" y="115" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Power Meter</text>
    <text x="65" y="135" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="10">RS485 Modbus</text>

    <!-- Isolated Transceiver -->
    <rect x="180" y="65" width="80" height="70" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="220" y="95" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">ISO RS485</text>
    <text x="220" y="115" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">MAX13487</text>

    <!-- Central ESP32 Gateway Node -->
    <rect x="310" y="30" width="160" height="140" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="325" y="45" width="130" height="40" rx="6" fill="#0369a1"/>
    <text x="390" y="70" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">ESP32 S3 / Dual Core</text>
    <text x="390" y="110" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">Core 0: Modbus RTU</text>
    <text x="390" y="130" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="10">Core 1: MQTT / WiFi</text>
    <text x="390" y="150" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="10">WDT Timer 24/7</text>

    <!-- Cloud / Dashboard -->
    <rect x="520" y="40" width="130" height="120" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="585" y="70" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">CLOUD SCADA</text>
    <text x="585" y="95" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">MQTT Broker</text>
    <text x="585" y="115" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Web Dashboard</text>
    <text x="585" y="135" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="10">Real-time Graphs</text>

    <!-- Trace lines -->
    <path d="M130 100 L 180 100" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>
    <path d="M260 100 L 310 100" stroke="#38bdf8" stroke-width="2"/>
    <path d="M470 100 L 520 100" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2"/>
  </g>

  <!-- Title Badge -->
  <rect x="180" y="370" width="440" height="38" rx="19" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="394" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="700">
    ESP32 INDUSTRIAL GATEWAY · MODBUS RTU &amp; 24/7 WATCHDOG
  </text>
</svg>
