<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0b1329"/>
  <!-- Technical Grid Background -->
  <g opacity="0.12">
    <path d="M0 50h800M0 100h800M0 150h800M0 200h800M0 250h800M0 300h800M0 350h800M0 400h800" stroke="#38bdf8" stroke-width="1"/>
    <path d="M50 0v450M100 0v450M150 0v450M200 0v450M250 0v450M300 0v450M350 0v450M400 0v450M450 0v450M500 0v450M550 0v450M600 0v450M650 0v450M700 0v450M750 0v450" stroke="#38bdf8" stroke-width="1"/>
  </g>
  <!-- Background Glow & Wave Lines -->
  <circle cx="400" cy="210" r="160" fill="#0284c7" opacity="0.08"/>
  <path d="M120 225 C 220 160, 300 300, 400 220 C 500 140, 580 290, 680 225" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>
  
  <!-- Article / Tech Document Graphic -->
  <g transform="translate(240, 90)">
    <!-- Document Card -->
    <rect x="0" y="0" width="320" height="230" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Top Bar -->
    <rect x="0" y="0" width="320" height="38" rx="12" fill="#0f172a"/>
    <circle cx="24" cy="19" r="5" fill="#ef4444"/>
    <circle cx="42" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="19" r="5" fill="#10b981"/>
    <text x="160" y="24" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">TECHNICAL NOTE / ARTICLE</text>
    
    <!-- Code / Article Lines -->
    <rect x="30" y="60" width="140" height="12" rx="3" fill="#38bdf8" opacity="0.9"/>
    <rect x="30" y="86" width="260" height="8" rx="2" fill="#64748b" opacity="0.6"/>
    <rect x="30" y="104" width="230" height="8" rx="2" fill="#64748b" opacity="0.6"/>
    <rect x="30" y="122" width="200" height="8" rx="2" fill="#64748b" opacity="0.6"/>
    
    <!-- Sub code block inside card -->
    <rect x="30" y="145" width="260" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="45" y="168" fill="#38bdf8" font-family="monospace" font-size="10">&gt; void init_hardware(void);</text>
    <text x="45" y="188" fill="#10b981" font-family="monospace" font-size="10">&gt; status = osKernelStart();</text>
  </g>

  <!-- Bottom Brand Ribbon -->
  <rect x="180" y="375" width="440" height="36" rx="18" fill="rgba(2, 132, 199, 0.15)" stroke="#0284c7" stroke-width="1"/>
  <text x="400" y="398" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">
    CHIA SẺ KINH NGHIỆM &amp; KIẾN THỨC KỸ THUẬT THỰC CHIẾN
  </text>
</svg>
