<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#090d16"/>
  <!-- Industrial Grid -->
  <g opacity="0.15">
    <path d="M0 45h800M0 90h800M0 135h800M0 180h800M0 225h800M0 270h800M0 315h800M0 360h800M0 405h800" stroke="#10b981" stroke-width="0.8"/>
    <path d="M45 0v450M90 0v450M135 0v450M180 0v450M225 0v450M270 0v450M315 0v450M360 0v450M405 0v450M450 0v450M495 0v450M540 0v450M585 0v450M630 0v450M675 0v450M720 0v450M765 0v450" stroke="#10b981" stroke-width="0.8"/>
  </g>
  <!-- PLC DIN Rail Box -->
  <rect x="220" y="90" width="360" height="270" rx="8" fill="#13233b" stroke="#10b981" stroke-width="2.5"/>
  <rect x="240" y="110" width="320" height="70" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="400" y="145" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="700">SIEMENS S7-1200 / MODBUS TCP</text>
  <text x="400" y="165" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10">PROFINET · SCADA / HMI INTEGRATION</text>
  <!-- SCADA Screen Simulator -->
  <rect x="260" y="200" width="280" height="135" rx="6" fill="#0f172a" stroke="#64748b"/>
  <!-- Gauges & Bars -->
  <rect x="280" y="225" width="100" height="12" rx="3" fill="#1e293b"/>
  <rect x="280" y="225" width="75" height="12" rx="3" fill="#10b981"/>
  <text x="390" y="235" fill="#94a3b8" font-family="monospace" font-size="9">75% PRESSURE</text>
  <rect x="280" y="250" width="100" height="12" rx="3" fill="#1e293b"/>
  <rect x="280" y="250" width="55" height="12" rx="3" fill="#0284c7"/>
  <text x="390" y="260" fill="#94a3b8" font-family="monospace" font-size="9">55°C TEMPERATURE</text>
  <rect x="280" y="275" width="100" height="12" rx="3" fill="#1e293b"/>
  <rect x="280" y="275" width="90" height="12" rx="3" fill="#f59e0b"/>
  <text x="390" y="285" fill="#94a3b8" font-family="monospace" font-size="9">900 RPM MOTOR</text>
  <!-- Status Lights -->
  <circle cx="515" cy="231" r="5" fill="#10b981"/>
  <circle cx="515" cy="256" r="5" fill="#10b981"/>
  <circle cx="515" cy="281" r="5" fill="#10b981"/>
  <!-- Banner -->
  <rect x="180" y="385" width="440" height="36" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.3)"/>
  <text x="400" y="408" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">
    Hệ Thống PLC & Giám Sát SCADA Công Nghiệp · Modbus TCP
  </text>
