<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0f172a"/>
  <!-- Circuit Grid Background -->
  <g opacity="0.15">
    <path d="M0 50h800M0 100h800M0 150h800M0 200h800M0 250h800M0 300h800M0 350h800M0 400h800" stroke="#38bdf8" stroke-width="1"/>
    <path d="M50 0v450M100 0v450M150 0v450M200 0v450M250 0v450M300 0v450M350 0v450M400 0v450M450 0v450M500 0v450M550 0v450M600 0v450M650 0v450M700 0v450M750 0v450" stroke="#38bdf8" stroke-width="1"/>
  </g>
  <!-- Circuit Traces -->
  <g stroke="#0284c7" stroke-width="2" fill="none" opacity="0.4">
    <path d="M100 120 L250 120 L280 150 L400 150"/>
    <path d="M400 225 L550 225 L600 275 L700 275"/>
    <path d="M150 350 L300 350 L350 300 L400 300"/>
    <circle cx="100" cy="120" r="4" fill="#0284c7"/>
    <circle cx="700" cy="275" r="4" fill="#0284c7"/>
    <circle cx="150" cy="350" r="4" fill="#0284c7"/>
  </g>
  <!-- Central Tech Card / Chip -->
  <rect x="260" y="125" width="280" height="200" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="290" y="155" width="220" height="140" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <!-- MCU Icon -->
  <rect x="375" y="185" width="50" height="50" rx="6" fill="#0284c7"/>
  <circle cx="400" cy="210" r="8" fill="#38bdf8"/>
  <text x="400" y="260" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12" letter-spacing="2">EMBEDDED HW / SW</text>
  <!-- Watermark badge -->
  <rect x="200" y="380" width="400" height="32" rx="16" fill="rgba(2, 132, 199, 0.2)" stroke="#0284c7" stroke-width="1"/>
  <text x="400" y="401" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600">
    HOÀI GIANG AUTOMATION — HỆ THỐNG ĐIỀU KHIỂN &amp; NHÚNG
  </text>
</svg>
