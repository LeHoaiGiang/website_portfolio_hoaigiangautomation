<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#090d16"/>
  <!-- Grid -->
  <g opacity="0.15">
    <path d="M0 50h800M0 100h800M0 150h800M0 200h800M0 250h800M0 300h800M0 350h800M0 400h800" stroke="#06b6d4" stroke-width="0.8"/>
    <path d="M50 0v450M100 0v450M150 0v450M200 0v450M250 0v450M300 0v450M350 0v450M400 0v450M450 0v450M500 0v450M550 0v450M600 0v450M650 0v450M700 0v450M750 0v450" stroke="#06b6d4" stroke-width="0.8"/>
  </g>
  <!-- ESP32 Module Outline -->
  <rect x="220" y="90" width="360" height="270" rx="14" fill="#13233b" stroke="#06b6d4" stroke-width="2"/>
  <!-- Antenna area -->
  <path d="M230 100 h340 v40 h-340 z" fill="#0f172a" stroke="#f59e0b" stroke-dasharray="4 4" stroke-width="1.5"/>
  <text x="400" y="125" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="11" letter-spacing="3">2.4GHz Wi-Fi / BLE 5.0 ANTENNA</text>
  <!-- Shield Can -->
  <rect x="280" y="160" width="240" height="150" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="400" y="210" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="18" font-weight="700">ESP32-S3</text>
  <text x="400" y="235" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11">Dual-Core Xtensa LX7 · 240MHz</text>
  <text x="400" y="255" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">MQTT / TLS / ThingsBoard / OTA</text>
  <!-- Cloud Sensor Data Streams -->
  <circle cx="160" cy="225" r="30" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <text x="160" y="222" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="9">SENSOR</text>
  <text x="160" y="234" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="8">HUB</text>
  <line x1="190" y1="225" x2="220" y2="225" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- Cloud Endpoint -->
  <circle cx="640" cy="225" r="30" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="640" y="222" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="9">CLOUD</text>
  <text x="640" y="234" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="8">TELEMETRY</text>
  <line x1="580" y1="225" x2="610" y2="225" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- Banner -->
  <rect x="180" y="385" width="440" height="36" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(6, 182, 212, 0.3)"/>
  <text x="400" y="408" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">
    ESP32 IoT Cloud Sensor Hub · MQTT / TLS / Dashboard
  </text>
</svg>
