<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0f172a"/>
  <!-- Technical Grid Background -->
  <g opacity="0.12">
    <path d="M0 50h800M0 100h800M0 150h800M0 200h800M0 250h800M0 300h800M0 350h800M0 400h800" stroke="#38bdf8" stroke-width="1"/>
    <path d="M50 0v450M100 0v450M150 0v450M200 0v450M250 0v450M300 0v450M350 0v450M400 0v450M450 0v450M500 0v450M550 0v450M600 0v450M650 0v450M700 0v450M750 0v450" stroke="#38bdf8" stroke-width="1"/>
  </g>
  <!-- FreeRTOS Architecture Block Diagram -->
  <g transform="translate(130, 75)">
    <!-- Task A Box -->
    <rect x="0" y="30" width="150" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="75" y="58" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Task_Sensor</text>
    <text x="75" y="78" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Priority: High (4)</text>
    <text x="75" y="96" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Stack: 256 words</text>

    <!-- Task B Box -->
    <rect x="0" y="145" width="150" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="75" y="173" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Task_Modbus</text>
    <text x="75" y="193" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Priority: Normal (2)</text>
    <text x="75" y="211" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Stack: 512 words</text>

    <!-- FreeRTOS Queue / IPC -->
    <rect x="210" y="75" width="140" height="110" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <text x="280" y="105" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">xQueueHandle</text>
    <rect x="225" y="120" width="110" height="20" rx="4" fill="#0284c7"/>
    <text x="280" y="134" text-anchor="middle" fill="#e0f2fe" font-family="monospace" font-size="10">Msg 1 | Msg 2 | Msg 3</text>
    <text x="280" y="165" text-anchor="middle" fill="#bae6fd" font-family="sans-serif" font-size="10">Thread-Safe IPC</text>

    <!-- Scheduler / Dispatcher -->
    <rect x="410" y="55" width="140" height="150" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="480" y="85" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">STM32 MCU</text>
    <text x="480" y="105" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">Cortex-M4 NVIC</text>
    <line x1="430" y1="120" x2="530" y2="120" stroke="#334155" stroke-width="1"/>
    <text x="480" y="142" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">SysTick Timer</text>
    <text x="480" y="162" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">PendSV Context Switch</text>
    <text x="480" y="185" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10">0% Deadlock</text>

    <!-- Connecting Arrows -->
    <path d="M150 72 L 210 110" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M150 187 L 210 150" stroke="#38bdf8" stroke-width="2"/>
    <path d="M350 130 L 410 130" stroke="#10b981" stroke-width="2"/>
  </g>

  <!-- Title Badge -->
  <rect x="180" y="370" width="440" height="38" rx="19" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="400" y="394" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700">
    STM32 &amp; FREERTOS · TASK SCHEDULING, IPC &amp; HARDFAULT PREVENTION
  </text>
</svg>
