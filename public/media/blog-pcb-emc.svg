<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#09131d"/>
  <!-- Circuit Grid Background -->
  <g opacity="0.12">
    <path d="M0 50h800M0 100h800M0 150h800M0 200h800M0 250h800M0 300h800M0 350h800M0 400h800" stroke="#0ea5e9" stroke-width="1"/>
    <path d="M50 0v450M100 0v450M150 0v450M200 0v450M250 0v450M300 0v450M350 0v450M400 0v450M450 0v450M500 0v450M550 0v450M600 0v450M650 0v450M700 0v450M750 0v450" stroke="#0ea5e9" stroke-width="1"/>
  </g>
  <!-- PCB Layer Stackup & Traces Diagram -->
  <g transform="translate(140, 80)">
    <!-- Board Outline -->
    <rect x="0" y="0" width="520" height="240" rx="10" fill="#132338" stroke="#0284c7" stroke-width="2"/>
    <circle cx="20" cy="20" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="500" cy="20" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="20" cy="220" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="500" cy="220" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Ground Plane Zone -->
    <rect x="40" y="40" width="200" height="160" rx="6" fill="#0c4a6e" opacity="0.4" stroke="#38bdf8" stroke-dasharray="4 4"/>
    <text x="140" y="60" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="11">GND PLANE (SOLID)</text>

    <!-- Decoupling Cap Cluster -->
    <rect x="70" y="90" width="30" height="15" rx="3" fill="#f59e0b"/>
    <text x="85" y="102" text-anchor="middle" fill="#000" font-family="monospace" font-size="8" font-weight="bold">100nF</text>
    <rect x="110" y="90" width="30" height="15" rx="3" fill="#f59e0b"/>
    <text x="125" y="102" text-anchor="middle" fill="#000" font-family="monospace" font-size="8" font-weight="bold">10uF</text>
    
    <!-- MCU IC Footprint -->
    <rect x="65" y="125" width="80" height="60" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="158" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">MCU QFP</text>

    <!-- TVS & Choke Filter Section -->
    <rect x="280" y="40" width="200" height="160" rx="6" fill="#1e293b" stroke="#10b981" stroke-dasharray="4 4"/>
    <text x="380" y="60" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="11">EMC FILTER / TVS DIODE</text>
    <rect x="310" y="95" width="40" height="24" rx="4" fill="#059669"/>
    <text x="330" y="111" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">CHOKE</text>
    <rect x="380" y="95" width="35" height="24" rx="4" fill="#dc2626"/>
    <text x="397" y="111" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">TVS</text>

    <!-- Traces -->
    <path d="M145 155 L 280 155 L 310 107" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    <path d="M350 107 L 380 107 L 450 107" stroke="#10b981" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Title Badge -->
  <rect x="180" y="370" width="440" height="38" rx="19" fill="rgba(14, 165, 233, 0.15)" stroke="#0284c7" stroke-width="1"/>
  <text x="400" y="394" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">
    PCB DESIGN · EMC/EMI SHIELDING &amp; HIGH-SPEED LAYOUT
  </text>
</svg>
