<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#090d16"/>
  <!-- Matrix / Logic Gate Grid -->
  <g opacity="0.15">
    <path d="M0 45h800M0 90h800M0 135h800M0 180h800M0 225h800M0 270h800M0 315h800M0 360h800M0 405h800" stroke="#a855f7" stroke-width="0.8"/>
    <path d="M45 0v450M90 0v450M135 0v450M180 0v450M225 0v450M270 0v450M315 0v450M360 0v450M405 0v450M450 0v450M495 0v450M540 0v450M585 0v450M630 0v450M675 0v450M720 0v450M765 0v450" stroke="#a855f7" stroke-width="0.8"/>
  </g>
  <!-- FPGA BGA Chip -->
  <rect x="250" y="90" width="300" height="270" rx="16" fill="#131e33" stroke="#a855f7" stroke-width="2.5"/>
  <rect x="290" y="130" width="220" height="190" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="400" y="195" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="20" font-weight="700">CYCLONE IV / ARTIX-7</text>
  <text x="400" y="225" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="12">Verilog HDL · Dual FOC Motor</text>
  <text x="400" y="248" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Sub-microsecond Control Loop</text>
  <!-- Logic Gate Accents -->
  <circle cx="170" cy="225" r="28" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="170" y="222" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="9">ENCODER</text>
  <text x="170" y="235" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="8">QUADRATURE</text>
  <circle cx="630" cy="225" r="28" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <text x="630" y="222" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="9">SVPWM</text>
  <text x="630" y="235" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="8">INVERTER</text>
  <!-- Banner -->
  <rect x="180" y="385" width="440" height="36" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.3)"/>
  <text x="400" y="408" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">
    FPGA Verilog High-Speed Motion Controller · FOC & SVPWM
  </text>
</svg>
